[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "us-quant-research"
version = "0.1.0"
description = "Reproducible ETF research and fail-closed IBKR paper trading"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "requests>=2.31,<3",
    "exchange-calendars>=4.7,<5",
]

[project.optional-dependencies]
paper = ["ib_async>=2.0,<3"]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]
research = [
    "bt==1.3.0",
    "ffn==1.3.0",
    "scipy>=1.13,<2",
    "scikit-learn==1.7.2",
    "threadpoolctl>=3,<4",
]

[project.scripts]
us-quant = "us_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
us_quant = ["notices/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
