name: Research reporting and isolated workbench

on:
  pull_request:
  push:
    branches: [main, integrate-research-reporting]

permissions:
  contents: read

jobs:
  reporting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python -m pip install -r requirements-reporting.txt
      - run: python -B scripts/check_publication.py
      - run: python -B scripts/test_research_reporting_guard.py
      - run: python -B scripts/test_incumbent_baseline_guard.py
      - run: python -B scripts/send_slack_signal_once.py --dry-run
      - run: python -B scripts/install_research_report_launchd.py --dry-run

  workbench:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[paper,dev,research]' -c requirements-research.lock
      - run: python -I -B -m pytest -q
