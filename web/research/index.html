<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>研究台账 · 美股因子研究</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">跳到研究内容</a>
  <header class="masthead">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 25V7h6v18M13 25V13h6v12M22 25V3h6v22"/></svg><div><strong>研究台账</strong><span>美股因子研究</span></div></div>
    <div class="update"><span id="freshness">正在读取已发布记录</span><button id="refresh" type="button">刷新记录</button></div>
  </header>
  <nav aria-label="研究视图" class="navigation">
    <button type="button" data-view="overview" aria-current="page">当前结论</button>
    <button type="button" data-view="strategies">策略历史 <span id="strategy-count"></span></button>
    <button type="button" data-view="factors">因子地图 <span id="factor-count"></span></button>
    <button type="button" data-view="history">研究日志</button>
  </nav>
  <main id="main" tabindex="-1">
    <div id="error" class="notice error" role="alert" hidden></div>
    <div id="loading" class="loading" role="status">读取研究账本，核对四条路径与历史记录…</div>
    <section id="overview" class="view" aria-label="当前研究结论" hidden></section>
    <section id="strategies" class="view" aria-label="策略历史" hidden>
      <div class="section-heading"><div><h1>每一次尝试都在这里</h1><p>保留未达标、旧协议和技术失败，不只展示赢家。</p></div><span id="result-count" aria-live="polite"></span></div>
      <div class="filters">
        <label class="search">搜索策略或资产<input id="search" type="search" placeholder="例如 SOXX、动量、美元、PDP"></label>
        <label>记录范围<select id="scope"><option value="all">全部记录</option><option value="recurring">当前研究协议</option><option value="legacy">旧 84 个配置</option></select></label>
        <label>结果<select id="status"><option value="all">全部结果</option><option value="lowdd">四路径回撤均 ≤15%</option><option value="qualified">全部门槛达标</option><option value="technical_failure">技术失败</option><option value="pending">等待评估</option></select></label>
        <label>排序<select id="sort"><option value="recent">最近研究</option><option value="sharpe">四路径最低夏普</option><option value="drawdown">最差回撤从低到高</option></select></label>
      </div>
      <div class="table-wrap"><table class="strategy-table"><thead><tr><th>策略 / 证据</th><th>结果</th><th>最低夏普</th><th>最大回撤</th><th>十年基础 CAGR</th><th>研究日期</th></tr></thead><tbody id="strategy-rows"></tbody></table></div>
      <p id="empty" class="empty" hidden>没有符合筛选条件的记录。清除搜索或切换记录范围，不会生成新的回测。</p>
      <div class="pagination"><button id="previous" type="button">上一页</button><span id="page-label"></span><button id="next" type="button">下一页</button></div>
    </section>
    <section id="factors" class="view" aria-label="因子地图" hidden></section>
    <section id="history" class="view" aria-label="研究日志" hidden></section>
  </main>
  <footer><span>只读研究页面，不连接券商，不提交订单。</span><span>历史截至 <time id="history-end">—</time>；刷新页面不会刷新行情。</span></footer>
  <dialog id="detail" aria-labelledby="detail-title"><div class="dialog-heading"><h2 id="detail-title">策略详情</h2><button id="close-detail" type="button" aria-label="关闭策略详情">关闭</button></div><div id="detail-body"></div></dialog>
</body>
</html>
